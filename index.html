<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloviz</title>
<meta name="description" content="Kartlarına bak, aklında tut, KABO de!">

<!-- Link önizlemesi (WhatsApp, Instagram, X, Telegram) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Cloviz yayında!">
<meta property="og:description" content="Kartlarına bak, aklında tut, KABO de!">
<meta property="og:image" content="https://burakfevzikar53.github.io/cloviz/link-onizleme-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://burakfevzikar53.github.io/cloviz/link-onizleme-1200x630.png">
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">

<style>
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root { color-scheme: dark; --gold: #e8c46c; --gold-hi: #fff1c4; --gold-lo: #a8782a; --ink: #f3ecd8; --sub: #c9bfa8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(circle at 50% 30%, #2e2140 0%, #0b0a14 62%); color: var(--ink);
         font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 32px 16px; }
  main { width: 100%; max-width: 440px; }

  /* ── Logo + YAYINDA! ── */
  .logo { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto;
          filter: drop-shadow(0 14px 26px rgba(0,0,0,.6)); }
  .live { margin: 10px 0 34px; font-size: 30px; font-weight: 700; letter-spacing: 8px; padding-left: 8px;
          background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
          -webkit-background-clip: text; background-clip: text; color: transparent;
          text-shadow: 0 0 24px rgba(232,196,108,.25); }

  /* ── Download block ── */
  .cta { position: relative; }
  .cta h2 { margin: 0; display: flex; align-items: center; gap: 14px; justify-content: center;
            font-size: 22px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 700; }
  .cta h2::before, .cta h2::after { content: ""; flex: 1; max-width: 70px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold)); }
  .cta h2::after { transform: scaleX(-1); }
  /* three chevrons that light up one after another, pointing at the buttons */
  .chev { display: flex; flex-direction: column; align-items: center; margin: 8px 0 16px; height: 34px; }
  .chev i { display: block; width: 14px; height: 14px; margin-top: -6px; border-right: 3px solid var(--gold);
            border-bottom: 3px solid var(--gold); transform: rotate(45deg); opacity: .15;
            animation: chev 1.5s ease-in-out infinite; }
  .chev i:nth-child(2) { animation-delay: .2s; } .chev i:nth-child(3) { animation-delay: .4s; }
  @keyframes chev { 0%, 100% { opacity: .15 } 35% { opacity: 1 } }

  .stores { display: grid; gap: 16px; }
  /* each store is a big tile with a slowly rotating gold border and a soft breathing glow */
  a.store { position: relative; display: flex; align-items: center; justify-content: center; gap: 18px;
            padding: 3px; border-radius: 20px; text-decoration: none; isolation: isolate;
            background: conic-gradient(from var(--a), var(--gold-lo), var(--gold-hi), var(--gold), var(--gold-lo) 40%,
                        rgba(232,196,108,.15) 60%, var(--gold-lo) 80%, var(--gold-hi));
            animation: spin 5s linear infinite, breathe 3s ease-in-out infinite;
            transition: transform .15s ease; }
  a.store:nth-child(2) { animation-delay: -2.5s, -1.5s; }
  .store .in { width: 100%; display: flex; align-items: center; justify-content: center; gap: 18px;
               padding: 16px 18px; border-radius: 17px; background: linear-gradient(180deg, #1a1626, #0c0b14); }
  @keyframes spin { to { --a: 360deg } }
  @keyframes breathe { 0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 rgba(232,196,108,0) }
                       50% { box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 26px rgba(232,196,108,.35) } }
  a.store:hover { transform: translateY(-3px) scale(1.02); }
  a.store:active { transform: scale(.97); }
  a.store:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
  a.store img.badge { width: 220px; max-width: 100%; height: auto; display: block; }
  a.store .qr { display: none; width: 92px; height: 92px; border-radius: 10px; }
  .note { display: none; margin: 16px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: var(--sub); }

  /* On a computer you cannot install a phone app: show QR codes to scan with the phone */
  @media (min-width: 720px) and (hover: hover) {
    main { max-width: 560px; }
    .store .in { justify-content: space-between; padding: 16px 22px; }
    a.store .qr { display: block; }
    .note { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { .chev i, a.store { animation: none; } .chev i { opacity: .8; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="cloviz-logo.webp" alt="Cloviz">
  <p class="live">YAYINDA!</p>

  <section class="cta" aria-label="İndir">
    <h2>HEMEN İNDİR</h2>
    <div class="chev" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/tr/app/cloviz/id6789584692?l=tr">
        <span class="in">
          <img class="badge" src="app-store-badge-tr.svg" alt="App Store'dan İndirin">
          <img class="qr" src="qr-ios.png" alt="">
        </span>
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.bloomgamesofficial.cloviz">
        <span class="in">
          <img class="badge" src="google-play-badge-tr.png" alt="Google Play'den Alın">
          <img class="qr" src="qr-android.png" alt="">
        </span>
      </a>
    </div>
    <p class="note">Bilgisayardaysan QR kodu telefonunun kamerasıyla okut.</p>
  </section>
</main>
<script>
  // Telefondan açılınca doğrudan doğru mağazaya gider; bilgisayarda bu sayfa görünür.
  (function () {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) location.replace(document.getElementById('ios').href);
    else if (isAndroid) location.replace(document.getElementById('android').href);
  })();
</script>
</body>
</html>
